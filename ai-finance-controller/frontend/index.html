<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Finance Controller - Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Exception Queue</h1>
            <span id="status" class="px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-semibold">Connecting...</span>
        </div>

        <div id="exceptions-container" class="space-y-6">
            <!-- Exceptions will be injected here -->
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8080/api";
        let currentRunId = null;

        async function init() {
            try {
                // 1. Get latest run
                const runRes = await fetch(`${API_BASE}/runs/latest`);
                const runData = await runRes.json();
                currentRunId = runData.run_id;
                
                // 2. Fetch exceptions for this run
                const excRes = await fetch(`${API_BASE}/exceptions/${currentRunId}`);
                const excData = await excRes.json();
                
                document.getElementById('status').textContent = `${excData.count} Pending Reviews`;
                document.getElementById('status').className = "px-4 py-2 bg-yellow-100 text-yellow-800 rounded-full text-sm font-semibold";
                
                renderExceptions(excData.exceptions);
            } catch (err) {
                document.getElementById('status').textContent = "Server Offline";
                document.getElementById('status').className = "px-4 py-2 bg-red-100 text-red-800 rounded-full text-sm font-semibold";
                console.error(err);
            }
        }

        function renderExceptions(exceptions) {
            const container = document.getElementById('exceptions-container');
            container.innerHTML = '';

            if (exceptions.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-200">No pending exceptions! The AI and Deterministic engines handled everything.</div>';
                return;
            }

            exceptions.forEach(exc => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col gap-4";
                card.innerHTML = `
                    <div class="flex justify-between border-b pb-4">
                        <div>
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Bank Transaction ID</span>
                            <p class="font-mono text-lg text-gray-900">${exc.source_record_id}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-red-400 uppercase tracking-wider">Severity</span>
                            <p class="font-bold text-red-600">${exc.severity}</p>
                        </div>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Failure Reason</span>
                        <p class="text-gray-700 bg-gray-50 p-3 rounded mt-1 text-sm font-mono">${exc.reason}</p>
                    </div>
                    <div class="flex gap-3 mt-2">
                        <input type="text" id="notes-${exc.source_record_id}" placeholder="Enter resolution notes..." class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="text" id="ledger-${exc.source_record_id}" placeholder="Target Ledger ID" class="w-48 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="resolve('${exc.source_record_id}')" class="bg-gray-900 hover:bg-black text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors">Force Match</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function resolve(bankId) {
            const notes = document.getElementById(`notes-${bankId}`).value;
            const ledgerId = document.getElementById(`ledger-${bankId}`).value;
            
            if (!ledgerId) return alert("You must provide a Ledger ID to force a match.");

            try {
                const res = await fetch(`${API_BASE}/exceptions/${currentRunId}/resolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bank_transaction_id: bankId,
                        ledger_entry_id: ledgerId,
                        notes: notes || "Manually resolved via dashboard"
                    })
                });

                if (res.ok) {
                    alert("Match forced successfully.");
                    init(); // Reload queue
                } else {
                    const error = await res.json();
                    alert("Error: " + error.detail);
                }
            } catch (err) {
                alert("Failed to connect to server.");
            }
        }

        init();
    </script>
</body>
</html>
